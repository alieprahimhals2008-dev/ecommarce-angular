<main class="min-h-screen bg-gray-50/50 pb-16 font-sans">
    <!-- Top Hero Banner -->
    <section
        class="w-full bg-gradient-to-r from-emerald-600 via-emerald-500 to-emerald-500 text-white py-10 px-4 sm:px-6 lg:px-12 shadow-xs">
        <div class="max-w-7xl mx-auto">
            <!-- Breadcrumb Navigation -->
            <nav class="flex items-center gap-2 text-xs sm:text-sm text-emerald-50/90 mb-4">
                <a href="/home" class="hover:text-white transition-colors">Home</a>
                <span class="opacity-60">/</span>
                <a href="/categories" class="hover:text-white transition-colors">Categories</a>
                <span class="opacity-60">/</span>
                <span class="font-semibold text-white underline underline-offset-4">Men's Fashion</span>
            </nav>

            <!-- Category Header: Image & Title -->
            <div class="flex items-center gap-4">
                <!-- Category Thumbnail Avatar -->
                <div
                    class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-white/20 p-1 border border-white/30 backdrop-blur-xs shadow-sm flex items-center justify-center shrink-0 overflow-hidden">
                    <img src="https://ecommerce.routemisr.com/Route-Academy-categories/1681511865180.jpeg"
                        alt="Men's Fashion" class="w-full h-full object-cover rounded-xl" />
                </div>

                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                        Men's Fashion
                    </h1>
                    <p class="text-xs sm:text-sm text-emerald-50/90 mt-0.5">
                        Choose a subcategory to browse products
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 pt-8">
        <!-- Back to Categories Link -->
        <div class="mb-6">
            <a href="/categories"
                class="inline-flex items-center gap-2 text-xs sm:text-sm font-medium text-gray-600 hover:text-emerald-600 transition-colors cursor-pointer group">
                <i class="fa-solid fa-arrow-left text-xs transition-transform group-hover:-translate-x-1"></i>
                <span>Back to Categories</span>
            </a>
        </div>

        <!-- Subcategories Count Heading -->
        <h2 class="text-base sm:text-lg font-bold text-gray-900 mb-6">
            {{SubCategoriesDetailes().results}} Subcategories in Men's Fashion
        </h2>

        <!-- Subcategories Grid Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            @for(sub of SubCategoriesDetailes().data; track sub._id){
            <a [routerLink]="['/Subcategoryproducts',sub._id]"
                class="group bg-white rounded-2xl p-6 border border-gray-100 shadow-xs hover:shadow-md hover:border-emerald-200 transition-all duration-200 flex flex-col justify-between cursor-pointer">
                <div>
                    <!-- Folder Icon Box -->
                    <div
                        class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-5 group-hover:bg-emerald-100 group-hover:scale-105 transition-all">
                        <i class="fa-solid fa-folder text-xl"></i>
                    </div>

                    <!-- Subcategory Name -->
                    <h3 class="text-base font-bold text-gray-900 group-hover:text-emerald-600 transition-colors">
                        {{sub.name}}
                    </h3>
                </div>
            </a>
            }
        </div>
    </div>
</main>
