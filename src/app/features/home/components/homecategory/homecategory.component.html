<section id="categories" class="py-10 px-4 sm:px-6 lg:px-8 xl:px-12 2xl:px-16 w-full">
  <!-- Section Header -->
  <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-8">
    <div class="flex items-center gap-3">
      <div class="h-8 w-1.5 bg-gradient-to-b from-emerald-500 to-emerald-700 rounded-full"></div>
      <h2 class="text-2xl md:text-3xl font-bold text-gray-900 tracking-tight">
        Shop By <span class="text-emerald-600">Category</span>
      </h2>
    </div>

    <a routerLink="/categories"
      class="text-emerald-600 hover:text-emerald-700 font-semibold flex items-center gap-2 text-sm group transition-colors">
      <span>View All Categories</span>
      <i class="fa-solid fa-arrow-right text-xs transition-transform group-hover:translate-x-1"></i>
    </a>
  </div>

  <!-- Categories Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-5 lg:grid-cols-6  gap-4 sm:gap-6">
    @for (cat of categories().data; track cat._id) {
    <a [routerLink]="['/categoriesproduct',cat._id]"
      class="group bg-white rounded-2xl p-4 text-center border border-gray-100 shadow-xs hover:shadow-lg hover:border-emerald-200 transition-all duration-300 flex flex-col items-center justify-between cursor-pointer">
      <!-- Circular Image Container -->
      <div
        class="w-20 h-20 sm:w-24 sm:h-24 rounded-full overflow-hidden bg-emerald-50 p-2 mb-3 border border-emerald-100/60 transition-transform duration-300 group-hover:scale-110 flex items-center justify-center">
        <img [src]="cat.image" [alt]="cat.name" class="w-full h-full object-cover rounded-full mix-blend-multiply" />
      </div>

      <h3 class="text-sm font-semibold text-gray-800 group-hover:text-emerald-600 transition-colors line-clamp-1">
        {{ cat.name }}
      </h3>
      <span class="text-[11px] text-gray-400 mt-0.5">Explore items</span>
    </a>
    }
  </div>
</section>
