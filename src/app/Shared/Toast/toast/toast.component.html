<div class="fixed top-20 right-4 sm:right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto w-full rounded-2xl p-4 shadow-xl border backdrop-blur-md transition-all duration-300 flex items-start justify-between gap-3 animate-slideIn"
      [class.bg-white]="true"
      [class.border-emerald-200]="toast.type === 'success'"
      [class.text-emerald-950]="toast.type === 'success'"
      [class.border-red-200]="toast.type === 'error'"
      [class.text-red-950]="toast.type === 'error'"
      [class.border-blue-200]="toast.type === 'info'"
      [class.text-blue-950]="toast.type === 'info'"
      [class.border-amber-200]="toast.type === 'warning'"
      [class.text-amber-950]="toast.type === 'warning'">

      <div class="flex items-start gap-3">
        <div class="mt-0.5 text-base shrink-0">
          @if (toast.type === 'success') {
            <i class="fa-solid fa-circle-check text-emerald-600"></i>
          } @else if (toast.type === 'error') {
            <i class="fa-solid fa-circle-xmark text-red-600"></i>
          } @else if (toast.type === 'info') {
            <i class="fa-solid fa-circle-info text-blue-600"></i>
          } @else {
            <i class="fa-solid fa-triangle-exclamation text-amber-600"></i>
          }
        </div>

        <div class="space-y-0.5">
          @if (toast.title) {
            <h4 class="text-xs font-bold leading-tight">{{ toast.title }}</h4>
          }
          <p class="text-xs font-medium text-gray-700 leading-snug">{{ toast.message }}</p>
        </div>
      </div>

      <button
        type="button"
        (click)="toastService.remove(toast.id)"
        class="text-gray-400 hover:text-gray-600 transition-colors p-1 -mr-1 -mt-1 cursor-pointer">
        <i class="fa-solid fa-xmark text-xs"></i>
      </button>
    </div>
  }
</div>
